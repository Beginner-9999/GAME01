<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>인생게임</title>
    <!-- PWA 설정을 위한 manifest 연결 -->
    <link rel="manifest" href="manifest.json">
    <!-- 모바일 주소창 색상 설정 -->
    <meta name="theme-color" content="#ffffff">
    <!-- iOS(아이폰) 앱 설치 지원 설정 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="인생게임">
    
    <style>
        body { font-family: sans-serif; text-align: center; background-color: #f4f4f4; margin: 0; padding: 20px; user-select: none; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .status-box { background: #eee; padding: 10px; border-radius: 5px; margin: 10px 0; }
        .monster { font-size: 80px; margin: 30px 0; cursor: pointer; transition: transform 0.1s; }
        .monster:active { transform: scale(0.9); }
        button { padding: 10px 20px; font-size: 16px; border: none; background: #007bff; color: white; border-radius: 5px; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div class="container">
        <h1>인생게임</h1>
        <p>태어나서 죽을 때까지, 클릭으로 살아남기</p>
        
        <div class="status-box">
            <div>💰 골드: <span id="gold">0</span></div>
            <div>✨ RP: <span id="rp">0</span></div>
            <div>👶 성장 단계: <strong>아기 (무럭무럭 자라는 중)</strong></div>
            <div>階 층: 1</div>
        </div>

        <div class="status-box">
            <p>🍼 젖병 HP: <span id="hp">100</span> / 100</p>
            <div class="monster" id="monster">🍼</div>
        </div>

        <div class="status-box">
            <div>공격력: 0 | 공격속도: 0/초</div>
            <div>크리확률: 0% | 크리데미지: 0%</div>
            <p style="color: red; font-size: 13px;">⚠ 지금 공격력으로는 너무 오래 걸려요. 환생을 고려해보세요!</p>
        </div>

        <button onclick="rebirth()">환생하기</button>
    </div>

    <script>
        // PWA 서비스 워커 등록 스크립트
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js')
                    .then(reg => console.log('서비스 워커 등록 성공:', reg.scope))
                    .catch(err => console.error('서비스 워커 등록 실패:', err));
            });
        }

        // 간단한 클릭 이벤트 예시
        let gold = 0;
        let hp = 100;
        const goldEl = document.getElementById('gold');
        const hpEl = document.getElementById('hp');
        const monsterEl = document.getElementById('monster');

        monsterEl.addEventListener('click', () => {
            hp -= 10;
            if (hp <= 0) {
                hp = 100;
                gold += 10;
                goldEl.innerText = gold;
            }
            hpEl.innerText = hp;
        });

        function rebirth() {
            if(confirm("정말 환생할까요?\n층수, 골드, 강화, 펫이 초기화되지만 영구 강화는 유지돼요.")) {
                gold = 0;
                hp = 100;
                goldEl.innerText = gold;
                hpEl.innerText = hp;
                alert("환생했습니다!");
            }
        }
    </script>
</body>
</html>
